<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="refresh" content="600">
<title>Pendel-Forecast</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#16202c; --muted:#5c6b7a;
    --line:#e2e8f0; --grid:#7c8aa0; --accent:#0f766e; --accent-soft:#ccdedb;
    --alt:#2563eb; --alt-soft:#e2ebfd;
    --good:#15803d; --good-soft:#d9ead9;
    --warn:#b45309; --warn-soft:#fdeccd; --bad:#b91c1c;
    --shadow:0 1px 2px rgba(16,32,44,.06),0 6px 20px rgba(16,32,44,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#0e141b; --card:#161f29; --ink:#e7edf4; --muted:#9aa9b8;
      --line:#26323f; --grid:#8496a8; --accent:#2dd4bf; --accent-soft:#1f3b39;
      --alt:#7ab0ff; --alt-soft:#1c2c46;
      --good:#4ade80; --good-soft:#183a26;
      --warn:#fbbf24; --warn-soft:#3a2f12; --bad:#f87171;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  header h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
  .route{color:var(--muted);font-size:14px}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);
    border:1px solid var(--line);color:var(--muted)}
  .badge.sample{background:#fef3c7;color:#92400e;border-color:#fcd34d}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .badge.sample{
    background:#3a2f12;color:#fbbf24;border-color:#7a5f1a}}
  .badge.live{background:var(--good-soft);color:var(--good);border-color:transparent}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:30px 0 12px;font-weight:600}

  .live{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.live{grid-template-columns:1fr}}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;box-shadow:var(--shadow)}
  .lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ldir{font-size:13px;color:var(--muted);font-weight:600}
  .pill{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .pill.good{background:var(--good-soft);color:var(--good)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.bad{background:var(--bad);color:#fff}
  .lbig{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;
    margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .lbig span{font-size:15px;font-weight:600;color:var(--muted);margin-left:5px}
  .lsub{font-size:12px;color:var(--muted);margin-bottom:11px}
  .lroutes{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
  .lr{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .lr .lt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .lr.win{font-weight:700;color:var(--accent)}
  .lr.win .lt{color:var(--accent)}
  .lnote{font-size:11px;color:var(--muted);margin-top:8px}

  .quality{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:620px){.quality{grid-template-columns:repeat(2,1fr)}}
  .qtile{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;box-shadow:var(--shadow)}
  .qtile .qv{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .qtile .ql{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
  .qhead{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
  .qhead h2{margin:0}
  .qnote{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.55}

  .entrybox{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;box-shadow:var(--shadow)}
  .erow2{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
  .rad{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
  .efields{display:flex;flex-wrap:wrap;gap:14px}
  .efields label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:4px}
  .efields input{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--ink);min-width:130px}
  .eactions{display:flex;align-items:center;gap:12px;margin-top:14px}
  .ebtn{font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border:none;border-radius:8px;
    background:var(--accent);color:#fff;cursor:pointer}
  .ebtn:hover{filter:brightness(1.05)}
  .eerr{font-size:12px;color:var(--bad)}
  .ehint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
  .elist{display:flex;flex-direction:column;gap:6px;margin-top:14px;
    border-top:1px dashed var(--line);padding-top:12px}
  .erow{display:flex;align-items:center;gap:10px;font-size:13px}
  .erow .ew{color:var(--muted);min-width:96px}
  .erow .ed{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
  .erow .ed.eh{background:var(--alt-soft);color:var(--alt)}
  .erow .et{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
  .edel{border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;
    cursor:pointer;padding:0 4px}
  .edel:hover{color:var(--bad)}

  .calib{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;box-shadow:var(--shadow)}
  .crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;
    border-top:1px dashed var(--line)}
  .crow:first-child{border-top:none}
  .clbl{font-size:13px;font-weight:600;min-width:150px}
  .crow .cn{font-size:12px;color:var(--muted);margin-left:auto}

  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media (max-width:760px){.week{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:440px){.week{grid-template-columns:1fr}}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;
    border-top:3px solid var(--accent)}
  .day:hover{transform:translateY(-1px)}
  .day.active{outline:2px solid var(--accent);outline-offset:1px}
  .day .name{font-weight:600;margin-bottom:8px}
  .leg{padding:8px 0;border-top:1px dashed var(--line)}
  .leg:first-of-type{border-top:none}
  .leg .dir{font-size:11px;color:var(--muted);margin-bottom:5px}
  .opt{display:flex;align-items:baseline;gap:7px;margin:4px 0}
  .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .k.spaet{background:var(--alt-soft);color:var(--alt)}
  .k.avoid{background:var(--warn-soft);color:var(--warn)}
  .opt .rng{font-size:16px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .opt .tt{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap}
  .na{color:var(--muted);font-size:12px;padding:6px 0}

  .detail{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;box-shadow:var(--shadow);margin-top:12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .tab{border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:6px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
  @media (max-width:720px){.charts{grid-template-columns:1fr}}
  .chart h3{margin:0 0 2px;font-size:15px}
  .chart .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
  .olist{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
  .orow{display:flex;align-items:baseline;gap:9px;padding:9px 11px;border-radius:10px;
    background:var(--bg);border:1px solid var(--line)}
  .orow .rng{font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .orow .meta{font-size:12px;color:var(--muted)}
  .orow .right{margin-left:auto;text-align:right}
  .orow .tt{font-size:14px;font-weight:600}
  .orow .later{font-size:11px;color:var(--alt);font-weight:600}
  .orow.av{background:var(--warn-soft);border-color:transparent}
  .orow.av .tt{color:var(--warn)}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;line-height:1.6}
  .foot code{background:var(--card);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pendel-Forecast</h1>
    <div class="route" id="route"></div>
    <div class="badges" id="badges"></div>
  </header>

  <div id="liveWrap"></div>

  <h2>Empfehlung &amp; Fahrzeit je Wochentag</h2>
  <div class="detail">
    <div class="tabs" id="tabs"></div>
    <div class="charts">
      <div class="chart">
        <h3 id="mTitle"></h3>
        <div class="sub" id="mSub"></div>
        <div id="mChart"></div>
      </div>
      <div class="chart">
        <h3 id="eTitle"></h3>
        <div class="sub" id="eSub"></div>
        <div id="eChart"></div>
      </div>
    </div>
  </div>

  <h2>Eigene Fahrt erfassen</h2>
  <div class="entrybox">
    <div class="eform">
      <div class="erow2">
        <label class="rad"><input type="radio" name="mdir" value="to_work" checked> Hinfahrt (Brühl → St. Augustin)</label>
        <label class="rad"><input type="radio" name="mdir" value="to_home"> Rückfahrt (St. Augustin → Brühl)</label>
      </div>
      <div class="efields">
        <label>Ankunftszeit<input type="time" id="mArr"></label>
        <label>Fahrzeit (Min)<input type="number" id="mTravel" min="1" step="1" placeholder="z. B. 48"></label>
      </div>
      <div class="eactions">
        <button class="ebtn" type="button" onclick="addManualEntry()">Fahrt hinzufügen</button>
        <span class="eerr" id="mErr"></span>
      </div>
      <div class="ehint"><b>Datum = heute</b> (automatisch aus der Geräte-Uhr). Die <b>Abfahrtszeit</b> wird aus
        Ankunft − Fahrzeit berechnet und als Punkt (●) ins Diagramm des heutigen Wochentags geplottet.
        Die Einträge werden nur in deinem Browser gespeichert.</div>
    </div>
    <div class="elist" id="entryList"></div>
  </div>

  <div id="calibWrap"></div>

  <div id="qualityWrap"></div>

  <div class="foot" id="foot"></div>
</div>

const $ = (id) => document.getElementById(id);
const fmtDay = (mins) => { mins=((mins%1440)+1440)%1440; return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'); };
const fmtHour = (mins) => { mins=((mins%1440)+1440)%1440; return String(Math.floor(mins/60))+" Uhr"; };
let selected = "0";

function renderHeader(){
  const f = FORECAST;
  $("route").textContent = f.route.origin + "  ⇄  " + f.route.destination;
  const b = $("badges");
  const gen = new Date(f.generated_at).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"});
  if(f.is_sample){
    b.innerHTML = `<span class="badge sample">Beispiel-Daten – noch keine echten Messungen</span>`
      + `<span class="badge">Stand ${gen}</span>`;
  } else {
    const range = f.date_range ? `${f.date_range.from} – ${f.date_range.to}` : "";
    b.innerHTML = `<span class="badge live">Live · ${f.data_points} Messungen</span>`
      + (range?`<span class="badge">${range}</span>`:``)
      + `<span class="badge">Stand ${gen}</span>`;
  }
}

function statusOf(travel, free){
  if(!free) return {cls:"", label:"–"};
  const r = travel/free;
  if(r < 1.15) return {cls:"good", label:"flüssig"};
  if(r < 1.5)  return {cls:"warn", label:"dicht"};
  return {cls:"bad", label:"Stau"};
}

function renderLive(){
  const live = FORECAST.live;
  const wrap = $("liveWrap");
  if(!live || !live.directions || !Object.keys(live.directions).length){ wrap.innerHTML=""; return; }
  let cards = "";
  ["to_work","to_home"].forEach(d=>{
    const dir = live.directions[d];
    if(!dir || !dir.routes || !dir.routes.length) return;
    const fast = dir.routes.find(r=>r.fastest) || dir.routes[0];
    const st = statusOf(fast.travel_min, dir.free_flow_min);
    const when = new Date(dir.updated_utc).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    const routes = dir.routes.map(r=>`<div class="lr${r.fastest?" win":""}">`
      + `<span class="ln">${r.name}${r.fastest?" ✓":""}</span>`
      + `<span class="lt">${r.travel_min} min${r.length_km?` · ${r.length_km} km`:""}</span></div>`).join("");
    const sub = fast.delay_min > 0
      ? `+${fast.delay_min} min gegenüber freier Fahrt (${dir.free_flow_min} min)`
      : "freie Fahrt";
    cards += `<div class="lcard">`
      + `<div class="lhead"><span class="ldir">${dir.label}</span>`
      + `<span class="pill ${st.cls}">${st.label}</span></div>`
      + `<div class="lbig">${fast.travel_min}<span>min</span></div>`
      + `<div class="lsub">${sub} · Stand ${when} Uhr</div>`
      + `<div class="lroutes">${routes}</div></div>`;
  });
  wrap.innerHTML = cards
    ? `<h2>Aktuell — welche Route ist jetzt am schnellsten?</h2><div class="live">${cards}</div>`
      + `<div class="lnote">Routen sind nach ihrer prägenden Strecke benannt (✓ = aktuell schnellste). „min" = aktuelle Fahrzeit inkl. Verkehr.</div>`
    : "";
}

function renderQuality(){
  const wrap = $("qualityWrap");
  const q = FORECAST.quality;
  if(FORECAST.is_sample || !q){
    wrap.innerHTML = `<div class="qhead"><h2>Datengüte</h2>`
      + `<span class="pill warn">Beispieldaten</span></div>`
      + `<div class="qnote">Noch keine echten Messungen – sobald der Sammel-Job läuft, erscheinen hier `
      + `Anzahl der Messungen, Sammeldauer, Dichte je Zeitfenster und die typische Genauigkeit.</div>`;
    return;
  }
  const first = q.first_day ? q.first_day.split("-").reverse().join(".") : "–";
  const acc = q.accuracy_min != null ? `±${q.accuracy_min} min` : "—";
  const accNote = q.accuracy_min != null
    ? "typische Schwankung zur gleichen Zeit"
    : "wird berechnet, sobald sich Wochentage wiederholen";
  const tiles = [
    [q.measurements, "Messungen gesamt"],
    [`${q.span_days} Tage`, `Daten seit ${first} · ${q.measure_days} Messtage`],
    [q.samples_per_slot, "Ø Messwerte je Zeitfenster"],
    [acc, `Genauigkeit — ${accNote}`],
  ].map(([v, l]) => `<div class="qtile"><div class="qv">${v}</div><div class="ql">${l}</div></div>`).join("");
  wrap.innerHTML = `<div class="qhead"><h2>Datengüte</h2>`
    + `<span class="pill ${q.level === "belastbar" ? "good" : "warn"}">${q.level_label}</span></div>`
    + `<div class="quality">${tiles}</div>`
    + `<div class="qnote"><b>Reifegrad:</b> Aufbauphase → Solide Basis → Belastbare Prognose (steigt mit der Zahl der `
    + `Messwerte je Wochentag/Zeitfenster). <b>Genauigkeit</b> ist die typische Schwankung der Fahrzeit zur gleichen `
    + `Zeit am gleichen Wochentag – je kleiner, desto verlässlicher die Vorhersage.</div>`;
}

function renderTabs(){
  const t = $("tabs"); t.innerHTML="";
  const tabs = [];
  for(let d=0; d<5; d++) tabs.push([String(d), FORECAST.weekdays[String(d)].label]);
  if(FORECAST.average) tabs.push(["avg", "Ø Mo–Fr"]);
  tabs.forEach(([key,label])=>{
    const btn = document.createElement("button");
    btn.className = "tab" + (key===selected?" active":"");
    btn.textContent = label;
    btn.onclick = () => { selected=key; renderDetail(); };
    t.appendChild(btn);
  });
}

// Gemeinsame y-Skala je Richtung: über ALLE Wochentage + Ø + eigene Fahrten,
// damit die Tages-Diagramme exakt gleich skaliert und direkt vergleichbar sind.
function yRangeFor(direction){
  const collect = (leg, vals) => {
    if(!leg || !leg.curve) return;
    const a = toMin(leg.window.start), b = toMin(leg.window.end);
    leg.curve.forEach(p => { if(p.mins_of_day>=a && p.mins_of_day<=b) vals.push(p.travel_min); });
  };
  const vals = [];
  const wd = FORECAST.weekdays || {};
  Object.keys(wd).forEach(k => collect(wd[k][direction], vals));
  if(FORECAST.average) collect(FORECAST.average[direction], vals);
  const ref = (FORECAST.average || wd[Object.keys(wd)[0]] || {})[direction];
  if(ref){
    const a = toMin(ref.window.start), b = toMin(ref.window.end);
    ENTRIES.filter(e=>e.direction===direction).forEach(e=>{
      const dm = toMin(e.departure);
      if(dm>=a && dm<=b) vals.push(e.travel_min);
    });
  }
  if(!vals.length) return null;
  return { yMin: Math.floor(Math.min(...vals)/5)*5, yMax: Math.ceil(Math.max(...vals)/5)*5 };
}

function chart(container, leg, avgCurve, manualPts, yRange){
  const W=440, H=240, PL=42, PR=14, PT=16, PB=44;
  // x-Achse fest auf das Zeitfenster (morgens 06–12, abends 14–20) – ruhiger & vergleichbar
  const xMin = toMin(leg.window.start), xMax = toMin(leg.window.end);
  const inWin = v => v >= xMin && v <= xMax;
  // Kurve/Durchschnitt/eigene Punkte aufs Fenster beschneiden, damit nichts über
  // den Diagrammrand hinausläuft (z. B. Messungen außerhalb der Pendelzeiten).
  const curve = (leg.curve || []).filter(p => inWin(p.mins_of_day));
  const avgC  = (avgCurve || []).filter(p => inWin(p.mins_of_day));
  const mpts  = (manualPts || []).filter(m => inWin(m.dep_min));
  if(curve.length < 2){ $(container).innerHTML = `<div class="na">noch keine Daten</div>`; return; }
  const ct = p => p.travel_min;   // Prognose unverändert (keine Kalibrierung aus eigenen Zeiten)
  // Gemeinsame Skala (über alle Tage) bevorzugen; sonst lokal aus dieser Kurve.
  let yMin, yMax;
  if(yRange){ yMin=yRange.yMin; yMax=yRange.yMax; }
  else {
    const ysAll = curve.map(ct).concat(avgC.map(ct)).concat(mpts.map(m=>m.travel_min));
    yMin=Math.floor(Math.min(...ysAll)/5)*5; yMax=Math.ceil(Math.max(...ysAll)/5)*5;
  }
  const X = v => PL + (v-xMin)/(xMax-xMin||1)*(W-PL-PR);
  const Y = v => PT + (1-(v-yMin)/(yMax-yMin||1))*(H-PT-PB);
  const rectW = (a,b) => Math.max(2, X(b)-X(a));

  // --- Ebene 1: Hintergrund-Flächen (günstige / zu meidende Fenster) ---
  let bg="";
  (leg.windows||[]).forEach(w=>{
    bg+=`<rect x="${X(w.from_min).toFixed(1)}" y="${PT}" width="${rectW(w.from_min,w.to_min).toFixed(1)}" `
      + `height="${H-PT-PB}" fill="var(--accent)" opacity=".13"/>`;
  });
  if(leg.avoid){
    bg+=`<rect x="${X(leg.avoid.from_min).toFixed(1)}" y="${PT}" width="${rectW(leg.avoid.from_min,leg.avoid.to_min).toFixed(1)}" `
      + `height="${H-PT-PB}" fill="var(--warn)" opacity=".16"/>`;
  }

  // --- Ebene 2: Datenlinien (Ø gestrichelt, Wochentag durchgezogen, eigene Punkte) ---
  let data="";
  if(avgC.length > 1){
    const al = avgC.map(p=>`${X(p.mins_of_day).toFixed(1)},${Y(ct(p)).toFixed(1)}`).join(" ");
    data+=`<polyline points="${al}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4"/>`;
  }
  const line = curve.map(p=>`${X(p.mins_of_day).toFixed(1)},${Y(ct(p)).toFixed(1)}`).join(" ");
  data+=`<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  mpts.forEach(m=>{
    data+=`<circle cx="${X(m.dep_min).toFixed(1)}" cy="${Y(m.travel_min).toFixed(1)}" r="4.5" `
      + `fill="var(--alt)" stroke="var(--card)" stroke-width="1.5"/>`;
  });

  // --- Ebene 3: Gitternetz + Achsenbeschriftung IM VORDERGRUND (gut ablesbar) ---
  let grid="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val=yMin+(yMax-yMin)*i/steps, y=Y(val);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--grid)" stroke-width="1.2"/>`;
  }
  for(let m=Math.ceil(xMin/60)*60; m<=xMax; m+=60){
    const x=X(m);
    grid+=`<line x1="${x}" y1="${PT}" x2="${x}" y2="${H-PB}" stroke="var(--grid)" stroke-width="1" stroke-dasharray="3 3" opacity=".85"/>`;
  }
  // Beschriftungen zuletzt, damit sie über allem liegen
  for(let i=0;i<=steps;i++){
    const val=yMin+(yMax-yMin)*i/steps, y=Y(val);
    grid+=`<text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="13" font-weight="600" fill="var(--muted)">${Math.round(val)}</text>`;
  }
  grid+=`<text x="${PL-8}" y="${PT-4}" text-anchor="end" font-size="11" fill="var(--muted)">min</text>`;
  for(let m=Math.ceil(xMin/60)*60; m<=xMax; m+=60){
    if(Math.floor(m/60) % 2 === 0){
      grid+=`<text x="${X(m)}" y="${H-PB+24}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${fmtHour(m)}</text>`;
    }
  }

  $(container).innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fahrzeit-Verlauf über den Tag">${bg}${data}${grid}</svg>`;
}

// ---- eigene Fahrten (im Browser gespeichert) ----
const LS_KEY = "pendelforecast_entries_v1";
const toMin = s => { const p = s.split(":"); return (+p[0])*60 + (+p[1]); };
function loadEntries(){ try{ return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ return []; } }
function saveEntries(a){ try{ localStorage.setItem(LS_KEY, JSON.stringify(a)); }catch(e){} }
let ENTRIES = loadEntries();

function manualPointsFor(direction){
  return ENTRIES
    .filter(e => e.direction===direction && (selected==="avg" || String(e.weekday)===selected))
    .map(e => ({dep_min: toMin(e.departure), travel_min: e.travel_min}));
}
function localToday(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addManualEntry(){
  const dir = document.querySelector('input[name="mdir"]:checked').value;
  const dateStr = localToday(), arr = $("mArr").value, travel = parseInt($("mTravel").value, 10);
  if(!arr || !(travel > 0)){
    $("mErr").textContent = "Bitte Ankunftszeit und Fahrzeit (Minuten) angeben."; return;
  }
  $("mErr").textContent = "";
  const depMin = ((toMin(arr) - travel) % 1440 + 1440) % 1440;
  const wd = (new Date(dateStr + "T00:00:00").getDay() + 6) % 7; // Mo=0 … So=6
  ENTRIES.push({id: Date.now(), direction: dir, date: dateStr, weekday: wd,
    arrival: arr, travel_min: travel, departure: fmtDay(depMin)});
  saveEntries(ENTRIES);
  $("mTravel").value = "";
  if(wd <= 4) selected = String(wd);
  renderDetail();
}
function deleteEntry(id){ ENTRIES = ENTRIES.filter(e => e.id!==id); saveEntries(ENTRIES); renderDetail(); }
function renderEntries(){
  const el = $("entryList");
  if(!ENTRIES.length){ el.innerHTML = `<div class="na">Noch keine eigenen Fahrten erfasst.</div>`; return; }
  const wl = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  const sorted = ENTRIES.slice().sort((a,b)=> (b.date===a.date ? b.id-a.id : (a.date<b.date?1:-1)));
  let html = sorted.slice(0,3).map(e=>{
    const dir = e.direction==="to_work" ? "Hin" : "Rück";
    return `<div class="erow"><span class="ew">${wl[e.weekday]} ${e.date.split("-").reverse().join(".")}</span>`
      + `<span class="ed ${e.direction==="to_work"?"":"eh"}">${dir}</span>`
      + `<span>ab ${e.departure} → an ${e.arrival}</span>`
      + `<span class="et">${e.travel_min} min</span>`
      + `<button class="edel" onclick="deleteEntry(${e.id})" title="löschen">×</button></div>`;
  }).join("");
  if(ENTRIES.length > 3){
    html += `<div class="na" style="padding-top:2px">+ ${ENTRIES.length-3} ältere (gespeichert &amp; weiter in den Diagrammen)</div>`;
  }
  el.innerHTML = html;
}

// ---- Abgleich: Prognose vs. eigene Fahrten (systematischer Versatz) ----
function predictTravel(direction, weekday, depMin){
  const wd = FORECAST.weekdays[String(weekday)];
  let leg = wd && wd[direction];
  let curve = (leg && leg.curve && leg.curve.length) ? leg.curve
    : (FORECAST.average && FORECAST.average[direction] ? FORECAST.average[direction].curve : []);
  if(!curve || !curve.length) return null;
  let best=null, bd=1e9;
  for(const p of curve){ const d=Math.abs(p.mins_of_day-depMin); if(d<bd){ bd=d; best=p; } }
  return (best && bd<=45) ? best.travel_min : null;
}
function calibrationStats(){
  const out = {to_work:{n:0,sum:0,mean:null}, to_home:{n:0,sum:0,mean:null}};
  ENTRIES.forEach(e=>{
    const pred = predictTravel(e.direction, e.weekday, toMin(e.departure));
    if(pred==null || !out[e.direction]) return;
    out[e.direction].n++; out[e.direction].sum += (e.travel_min - pred);
  });
  ["to_work","to_home"].forEach(d=>{ if(out[d].n) out[d].mean = out[d].sum/out[d].n; });
  return out;
}
function renderCalibration(){
  const el = $("calibWrap");
  const s = calibrationStats();
  const rows = [["to_work","Hinweg (morgens)"],["to_home","Rückweg (abends)"]].map(([d,lbl])=>{
    const st = s[d];
    if(!st.n) return "";
    const m = st.mean, abs = Math.abs(m).toFixed(0);
    let txt, cls;
    if(Math.abs(m) < 1){ txt = "Prognose trifft gut (±0 min)"; cls="good"; }
    else if(m < 0){ txt = `Prognose ~${abs} min zu hoch (überschätzt)`; cls="warn"; }
    else { txt = `Prognose ~${abs} min zu niedrig (unterschätzt)`; cls="warn"; }
    return `<div class="crow"><span class="clbl">${lbl}</span>`
      + `<span class="pill ${cls}">${txt}</span>`
      + `<span class="cn">${st.n} Fahrt(en)</span></div>`;
  }).join("");
  if(!rows){ el.innerHTML = ""; return; }
  el.innerHTML = `<h2>Prognose-Qualität: TomTom vs. deine Fahrten</h2><div class="calib">${rows}`
    + `<div class="qnote">Zeigt, wie gut die TomTom-Prognose zu deinen tatsächlich gefahrenen Zeiten passt `
    + `(gleiche Zeit/Richtung). „zu hoch" = du warst schneller als vorhergesagt, „zu niedrig" = langsamer. `
    + `<b>Reiner Qualitäts-Check</b> – diese Werte fließen NICHT in die Prognose ein und verändern sie nicht.</div></div>`;
}

function renderDetail(){
  renderTabs();
  const isAvg = selected==="avg";
  const day = isAvg ? FORECAST.average : FORECAST.weekdays[selected];
  $("mTitle").textContent = day.to_work.label + (isAvg ? " · morgens (Ø)" : " · morgens");
  $("eTitle").textContent = day.to_home.label + (isAvg ? " · abends (Ø)" : " · abends");
  const ffm = day.to_work.free_flow_min, ffe = day.to_home.free_flow_min;
  $("mSub").textContent = "Fenster " + day.to_work.window.start + "–" + day.to_work.window.end
    + (ffm?` · frei ~${ffm} min`:``);
  $("eSub").textContent = "Fenster " + day.to_home.window.start + "–" + day.to_home.window.end
    + (ffe?` · frei ~${ffe} min`:``);
  const avgW = (isAvg || !FORECAST.average) ? null : FORECAST.average.to_work.curve;
  const avgE = (isAvg || !FORECAST.average) ? null : FORECAST.average.to_home.curve;
  // gemeinsame y-Skala je Richtung, über alle Wochentage – identische Skalierung
  chart("mChart", day.to_work, avgW, manualPointsFor("to_work"), yRangeFor("to_work"));
  chart("eChart", day.to_home, avgE, manualPointsFor("to_home"), yRangeFor("to_home"));
  renderEntries();
  renderCalibration();
}

function renderFoot(){
  const f = FORECAST;
  $("foot").innerHTML =
    "Im Diagramm: <b>grün hinterlegt</b> = günstige Abfahrtsfenster (Fahrzeit nahe am Tagesminimum, ±"+Math.round(f.tolerance*100)+" %); "
    + "<b>rot hinterlegt</b> = Stau-Spitze (meiden). Durchgezogene Linie = Prognose des gewählten Wochentags, "
    + "<b>gestrichelt</b> = Durchschnitt aller Wochentage (Mo–Fr, eigener Reiter „Ø Mo–Fr\"), <b>● Punkte</b> = deine "
    + "selbst erfassten Fahrten (nur zum Vergleich – sie verändern die Prognose nicht). "
    + "Fahrzeiten sind Mediane je 15-Minuten-Fenster. "
    + (f.is_sample
        ? "<br><b>Hinweis:</b> Aktuell werden Beispielwerte gezeigt. Sobald der Sammel-Job läuft, ersetzen echte Messungen die Kurven automatisch."
        : "Datenquelle: TomTom Traffic. Aktualisierung durch den Sammel-Job.");
}

renderHeader(); renderLive(); renderDetail(); renderQuality(); renderFoot();
</script>
